# Gallery example 5: RESP charge distribution for BODIPY-Et
# Molecule: BODIPY core with ethyl meso-substituent — neutral fluorescent dye
# Formula ~ C17H19BF2N2, charge 0, singlet
# End-to-end: RDKit conformers → XTB2 pre-opt → B3LYP/def2-SVP OPT + RESP

system:
  name: bodipy-et
  description: >-
    BODIPY dye with ethyl group at the meso position (8-position).
    Neutral fluorescent marker; proposed negative control for mitochondria-targeting study.
    Charge 0, singlet.

tracy:
  conformer_engine: rdkit
  expected_engine: orca

  n_conformers: 10
  random_seed: 42
  run_preopt: true
  preopt_top_k: 3

  charge: 0
  multiplicity: 1

  solvents:
    - null          # vacuum
    - Water         # CPCM implicit solvent

orca:
  preopt:
    method: XTB2
    input_blocks:
      pal:
        nproc: 64   # must match num_mpiprocs_per_machine in scheduler options

  opt:
    method: B3LYP
    basis: def2-SVP
    dispersion: D3BJ
    resp_keyword: RESP
    input_blocks:
      pal:
        nproc: 64
