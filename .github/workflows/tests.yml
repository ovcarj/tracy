name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install non-PyPI dependencies
        run: |
          pip install "git+https://github.com/ovcarj/aiida-charmm-gui.git"
          pip install "git+https://github.com/ovcarj/aiida-orca.git@update-orca-parser"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q
