[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracy"
dynamic = ["version"]
description = "AiiDA-based workflow package for building and simulating mitochondrial membrane systems."
readme = "README.md"
authors = [{name = "Juraj Ovčar", email = "juraj.ovcar@gmail.com"}]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Framework :: AiiDA",
]
keywords = ["aiida", "plugin", "membrane", "molecular-dynamics", "charmm-gui"]
requires-python = ">=3.10"
dependencies = [
    "aiida-core>=2.5,<3",
    "aiida-charmm-gui",
]

[project.optional-dependencies]
gromacs = ["aiida-gromacs"]
dev = [
    "pytest>=7.0",
    "pyyaml",
]

[project.entry-points."aiida.calculations"]
"tracy.trjconv"  = "tracy.calculations.trjconv:TrjconvCalculation"
"tracy.potential" = "tracy.calculations.potential:PotentialCalculation"

[project.entry-points."aiida.parsers"]
"tracy.trjconv"  = "tracy.calculations.trjconv:TrjconvParser"
"tracy.potential" = "tracy.calculations.potential:PotentialParser"

[project.entry-points."aiida.workflows"]
"tracy.build_membrane"             = "tracy.workflows.membrane_builder:BuildMembraneWorkChain"
"tracy.gromacs_run"                = "tracy.workflows.gromacs_run:GromacsRunWorkChain"
"tracy.run_membrane_md"            = "tracy.workflows.membrane_md:RunMembraneMDWorkChain"
"tracy.compute_membrane_potential" = "tracy.workflows.electrostatics:ComputeMembranePotentialWorkChain"

[tool.hatch.version]
path = "tracy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tracy"]

[tool.pytest.ini_options]
python_files = "test_*.py"
filterwarnings = [
    "ignore::DeprecationWarning:aiida:",
    "ignore:Creating AiiDA configuration folder:",
    "ignore::DeprecationWarning:plumpy:",
    "ignore::DeprecationWarning:yaml:",
]
