# Tracy protocol: mitochondrial inner membrane
#
# Reference protocol for a cardiolipin-containing asymmetric bilayer
# representative of the mitochondrial inner membrane (IMM).
#
# All quick_bilayer parameters correspond to inputs of
# QuickBilayerWorkChain in aiida-charmm-gui.  Parameters that map
# directly to the CHARMM-GUI Quick Bilayer API are noted.

system:
  name: mitochondrial_inner_membrane
  description: >-
    Asymmetric cardiolipin-containing bilayer representative of the
    mitochondrial inner membrane.  Built via CHARMM-GUI Quick Bilayer
    with the CHARMM36m force field and GROMACS output.

charmm_gui:
  module: membrane_builder

  quick_bilayer:

    # ------------------------------------------------------------------
    # Lipid composition
    # ------------------------------------------------------------------
    # Two mutually exclusive options:
    #
    # Option A — CHARMM-GUI preset membrane type (API field: membtype).
    # Available presets include: PMm (plasma membrane mammalian),
    # PMf (fungal), PMp (plant), ENDm (endosomal), aPM (asymmetric PM).
    # No preset exists for the IMM; use Option B for custom composition.
    #
    #   membtype: PMm
    #
    # Option B — custom asymmetric composition (API fields: upper, lower).
    # Format: "LIP1:LIP2:LIP3=ratio1:ratio2:ratio3"
    # Ratios are molar percentages and must sum to 100.
    #
    # ------------------------------------------------------------------
    # CHARMM36/36m lipid residue codes
    # Verify against the CHARMM-GUI Membrane Builder lipid library
    # (charmm-gui.org) before submitting, as new lipids are added
    # regularly.
    # ------------------------------------------------------------------
    #
    # Phosphatidylcholines (PC) — neutral
    #   DLPC  12:0/12:0    dilauroyl-PC
    #   DMPC  14:0/14:0    dimyristoyl-PC
    #   DPPC  16:0/16:0    dipalmitoyl-PC (gel phase at 298 K)
    #   DSPC  18:0/18:0    distearoyl-PC
    #   POPC  16:0/18:1    palmitoyl-oleoyl-PC (most common model PC)
    #   DOPC  18:1/18:1    dioleoyl-PC
    #   PLPC  16:0/18:2    palmitoyl-linoleoyl-PC (n-6, common in mitochondria)
    #   PAPC  16:0/20:4    palmitoyl-arachidonoyl-PC (n-6)
    #   SAPC  18:0/20:4    stearoyl-arachidonoyl-PC (n-6, abundant in mammalian IMM)
    #   PDPC  16:0/22:6    palmitoyl-DHA-PC (n-3)
    #   SDPC  18:0/22:6    stearoyl-DHA-PC (n-3, common in mammalian mitochondria)
    #
    # Phosphatidylethanolamines (PE) — neutral
    #   DMPE  14:0/14:0
    #   DPPE  16:0/16:0
    #   DSPE  18:0/18:0
    #   POPE  16:0/18:1    palmitoyl-oleoyl-PE (most common model PE)
    #   DOPE  18:1/18:1    dioleoyl-PE
    #   PLPE  16:0/18:2    palmitoyl-linoleoyl-PE (n-6)
    #   PAPE  16:0/20:4    palmitoyl-arachidonoyl-PE (n-6)
    #   SAPE  18:0/20:4    stearoyl-arachidonoyl-PE (n-6)
    #   SDPE  18:0/22:6    stearoyl-DHA-PE (n-3, common in mammalian mitochondria)
    #
    # Phosphatidylserines (PS) — negatively charged (−1 e)
    #   DPPS  16:0/16:0
    #   POPS  16:0/18:1    (preferentially in inner leaflet; Ca²⁺ binding)
    #   DOPS  18:1/18:1
    #
    # Phosphatidylglycerols (PG) — negatively charged (−1 e)
    #   DPPG  16:0/16:0
    #   POPG  16:0/18:1    (abundant in bacterial and chloroplast membranes)
    #   DOPG  18:1/18:1
    #
    # Phosphatidylinositols (PI) — negatively charged (−1 e)
    #   DPPI  16:0/16:0
    #   POPI  16:0/18:1    (outer mitochondrial membrane, ER, plasma membrane)
    #
    # Cardiolipins (CL) — negatively charged
    #   Suffix "2" = fully deprotonated (−2 e); use at physiological pH.
    #   Suffix "1" = monoprotonated (−1 e); use only if specifically modelling
    #               the partially protonated form (rare; low pKa in membranes).
    #
    #   TMCL1 / TMCL2   14:0×4  tetramyristoyl-CL  (bacteria)
    #   TPCL1 / TPCL2   16:0×4  tetrapalmitoyl-CL
    #   TLCL1 / TLCL2   18:2×4  tetralinoleoyl-CL  ← dominant in mammalian IMM
    #   TOCL1 / TOCL2   18:1×4  tetraoleoyl-CL     ← dominant in yeast IMM
    #
    # Sphingomyelins (SM) — neutral
    #   PSM   16:0 (N-palmitoyl)    most common in mammalian plasma membrane
    #   SSM   18:0 (N-stearoyl)
    #   BNSM  22:0 (N-behenoyl)
    #   LSM   24:1 (N-nervonoyl)
    #
    # Sterols — neutral
    #   CHL1   cholesterol  (mammalian)
    #   ERG    ergosterol   (yeast/fungal)
    #
    # ------------------------------------------------------------------
    # Example compositions
    # ------------------------------------------------------------------
    # NOTE: These are simplified simulation models.  The cited papers
    # report lipid class distributions at the whole-membrane level;
    # exact molecular-species ratios and leaflet asymmetries are
    # modeling choices, not values directly reported in any single source.
    # Mitochondrial inner/outer leaflet asymmetry is not well-characterised
    # experimentally.
    #
    # Mammalian IMM — simplified PC/PE/CL model:
    #   IMM enriched in PE, PC (~80% combined), and CL (~15-20%)
    #   (Hovius et al. BBA 1990; Comte et al. BBA 1976; Schlame et al. PLR 2000)
    #   upper: "POPE:POPC:TLCL2=40:40:20"
    #   lower: "POPE:POPC:TLCL2=45:35:20"
    #
    # Mammalian IMM — PUFA-enriched species model:
    #   Mammalian mitochondrial PC and PE carry predominantly 18:2 (n-6) and
    #   20:4 (n-6) chains (Hovius 1990; Comte 1976).  SAPC, PLPC, SAPE are
    #   representative PUFA species; exact ratios are modeling choices.
    #   upper: "POPE:SAPC:PLPC:TLCL2=35:20:15:30"
    #   lower: "POPE:SAPC:PLPC:TLCL2=38:18:12:32"
    #
    # Mammalian OMM — simplified:
    #   OMM is PC/PE-rich with minor PI and PS; very low CL (Hovius 1990).
    #   Native OMM also contains SM and cholesterol, omitted here for simplicity
    #   (Schiaffarino et al. Front Mol Biosci 2022).
    #   upper: "POPC:POPE:POPI:POPS=50:30:10:10"
    #   lower: "POPC:POPE:POPI:POPS=48:32:12:8"
    #
    # Yeast IMM (S. cerevisiae) — simplified:
    #   S. cerevisiae IMM enriched in PE, PI, PC, and CL (Zinser et al. JBacteriol 1991).
    #   TOCL2 (tetraoleoyl CL) chosen as representative of yeast CL acyl composition.
    #   upper: "POPE:POPI:POPC:TOCL2=40:15:25:20"
    #   lower: "POPE:POPI:POPC:TOCL2=35:15:30:20"
    #
    # Mammalian plasma membrane — didactic raft-forming model:
    #   Outer leaflet SM/cholesterol-enriched; inner leaflet PE/PS-enriched
    #   (van Meer et al. NRMCB 2008).  Species ratios not from a primary source.
    #   upper: "POPC:PSM:CHL1=25:40:35"
    #   lower: "POPE:POPS:POPC:CHL1=45:15:15:25"
    #
    # Symmetric model bilayer (single-component, for benchmarking):
    #   upper: "POPC=100"
    #   lower: "POPC=100"
    #   # Gel-phase benchmark: use DPPC instead of POPC.
    #
    # ------------------------------------------------------------------
    # Active composition
    # ------------------------------------------------------------------
    upper: "POPE:POPC:TLCL2=40:40:20"
    lower: "POPE:POPC:TLCL2=45:35:20"

    # ------------------------------------------------------------------
    # System type
    # ------------------------------------------------------------------
    # membrane_only: true  — no protein; jobid_pdb not required.
    # membrane_only: false — embed a protein; provide jobid_pdb.
    membrane_only: true
    # jobid_pdb: "XXXXXXXX"   # job ID from CHARMM-GUI PDB Reader module

    # ------------------------------------------------------------------
    # Box geometry
    # ------------------------------------------------------------------
    margin: 20.0     # distance from membrane edge to box boundary in Å
    wdist: 22.5      # water layer thickness per side in Å

    # ------------------------------------------------------------------
    # Solvent and ions  (API fields: Ion_conc, Ion_type)
    # ------------------------------------------------------------------
    ion_conc: 0.15   # ion concentration in M
    ion_type: KCl    # KCl or NaCl
    # CHARMM36 residue names:
    #   KCl  →  K+ = POT,  Cl- = CLA   (use in electrostatics protocol)
    #   NaCl →  Na+ = SOD, Cl- = CLA

    # ------------------------------------------------------------------
    # Force-field converter
    # ------------------------------------------------------------------
    # Runs the CHARMM-GUI ff converter after membrane construction,
    # producing input files for GROMACS, AMBER, NAMD, and OpenMM
    # in addition to the default CHARMM output.
    # API field: run_ffconverter.  Default: true.
    run_ff_converter: true

    # Temperature used by the ff converter when generating MD input
    # files (NpT reference temperature, thermostat target).  In K.
    # Default: 303.15.  Physiological: 310.15.
    temperature: 310.15

    # ------------------------------------------------------------------
    # CHARMM force-field options
    # ------------------------------------------------------------------
    # Hydrogen mass repartitioning — transfers mass from heavy atoms to
    # bonded hydrogens, allowing a 4 fs MD timestep.  Recommended for
    # equilibration and production runs.  API field: charmmff_hmr_checked.
    charmmff_hmr_checked: true

    # WYF patch for Trp/Tyr/Phe aromatic residues in protein systems.
    # Has no effect on pure-lipid systems.  API field: charmmff_wyf_checked.
    charmmff_wyf_checked: false

    # Run a short CHARMM energy minimisation before invoking the
    # ff converter.  API field: charmm_mini.  Default: false.
    charmm_mini: false

tracy:
  expected_engine: gromacs
  membrane_normal_axis: z
  require_gromacs_files: true
