# Tracy example protocol: mitochondrial membrane
#
# Copy this file and adjust the parameters for your specific system.

system:
  name: mitochondrial_membrane_test
  description: >-
    Test mitochondrial inner membrane system submitted via tracy.

charmm_gui:
  module: membrane_builder

  quick_bilayer:
    # Use a CHARMM-GUI preset membrane type.
    # PMm = plasma membrane (mammalian) — adjust to the correct preset.
    membtype: PMm
    membrane_only: true
    margin: 20.0
    wdist: 22.5
    ion_conc: 0.15
    ion_type: NaCl

tracy:
  expected_engine: gromacs
  membrane_normal_axis: z
  require_gromacs_files: true
  output_interface_version: "0.1"
